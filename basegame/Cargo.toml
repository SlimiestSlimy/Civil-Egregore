[package]
name = "basegame"
edition = "2024"
description = "Civil Egregore's base game: its types, the libraries they expose, the rules of its cells and entities, and its world generation"

[dependencies]
protocol = { path = "../protocol" }
server = { path = "../server" }
# The render rules' and the windows' code: the client's API and Bevy,
# only with the `client` feature.
client = { path = "../client", optional = true }
bevy = { version = "0.19", default-features = false, features = ["2d", "ui", "bevy_feathers"], optional = true }

[features]
# The render rules and the windows with their code: a windowed build's. Without it they
# are registered all the same, of no code.
client = ["dep:client", "dep:bevy"]

# The tests' seed (`utilities/test_seed.rs`) reads and writes through
# utilities; the crate itself reaches it only through the server's API.
[dev-dependencies]
utilities = { path = "../utilities" }
