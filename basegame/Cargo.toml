# Civil Egregore's base game, a container mod carrying its mods: a
# workspace of its own, a crate a mod, each a dylib -- packaged by the
# game's mod packager, against the game's libraries as compiled.
[workspace]
members = ["common", "server"]
resolver = "3"

# The game's own: the same profile builds the same libraries.
[profile.release]
debug = "line-tables-only"
