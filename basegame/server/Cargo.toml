[package]
name = "basegame_server"
edition = "2024"
description = "The base game's server mod: what it takes of the common mod"

# A mod: one library, loaded by the game.
[lib]
crate-type = ["dylib"]

# The source each is developed with; packaging drops it, the compiled
# libraries given instead.
[target.'cfg(not(civil_egregore_packaging))'.dependencies]
utilities = { path = "../../utilities" }
protocol = { path = "../../protocol" }
server = { path = "../../server" }
basegame_common = { path = "../common" }
