[package]
name = "basegame_common"
edition = "2024"
description = "The base game's common mod: grass"

# A mod: one library, loaded by the game.
[lib]
crate-type = ["dylib"]

# The source each is developed with; packaging drops it, the compiled
# libraries given instead.
[target.'cfg(not(civil_egregore_packaging))'.dependencies]
protocol = { path = "../../protocol" }
