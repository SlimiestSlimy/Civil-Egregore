[package]
name = "renderer"
version = "0.1.0"
edition = "2024"
description = "Civil Egregore on the screen: a Bevy window asking the server's host, on its own thread, for the cells of its viewport"

[dependencies]
utilities = { path = "../utilities" }
gui = { path = "../gui" }
server = { path = "../server" }
mc_rules = { path = "../mc_rules" }
worldgen = { path = "../worldgen" }
coordinates = { path = "../coordinates" }
bitmap = { path = "../bitmap" }
chunk_storage = { path = "../chunk_storage" }
# Bevy for the window, the drawing and the keys only: no 3D, no audio.
bevy = { version = "0.19", default-features = false, features = ["2d", "ui"] }

[features]
# The machine's settings file is neither read nor written: the settings are the default ones.
force_default_settings = ["utilities/force_default_settings"]
