[package]
name = "Civil_Egregore"
version = "0.6.0"
edition = "2024"
description = "Nudges to Civilization."
authors = ["SlimiestSlimy", "Opus 5.5 high"]
repository = "https://github.com/SlimiestSlimy/Civil-Egregore.git"

[dependencies]
renderer = { path = "renderer", optional = true }
protocol = { path = "protocol/protocol" }
server = { path = "server" }
utilities = { path = "utilities" }

# What the root's tests (`tests/fine`, `tests/fast`, `tests/complete`) reach into.
[dev-dependencies]
base_types = { path = "basegame/base_types" }
libraries = { path = "basegame/libraries" }
bitplane_manager = { path = "bitplane_manager" }
chunk_storage = { path = "chunk_storage" }
coordinates = { path = "coordinates" }
entity_manager = { path = "entity_manager" }
entity_rules = { path = "basegame/entity_rules" }
pathfinding = { path = "pathfinding" }
sca_rules = { path = "basegame/sca_rules" }
simulation = { path = "simulation" }
type_registry = { path = "type_registry" }
worldgen = { path = "worldgen" }

[features]
# `--features force_default_settings`: run on the built-in defaults
# (`utilities/force_default_settings.csv`), ignoring the machine's `settings.csv`.
force_default_settings = ["utilities/force_default_settings", "renderer?/force_default_settings"]
default = ["renderer"]

# Every crate of Civil Egregore, built together: one lock file and one `target/`
# for them all, here, whichever crate's folder cargo is run from.
# `cargo test` here tests every one but the renderer and its menus,
# which bring Bevy: `cargo run --release` opens the window. Tessera's external
# benchmarks stay a workspace of their own, so the codecs they compare
# against never enter this build.
[workspace]
members = [
    "protocol/protocol",
    "basegame/base_types",
    "basegame/libraries",
    "bitmap",
    "bitplane_manager",
    "chunk_storage",
    "coordinates",
    "entity_manager",
    "basegame/entity_rules",
    "gui",
    "pathfinding",
    "basegame/sca_rules",
    "simulation",
    "worldgen",
    "type_registry",
    "utilities",
    "renderer",
    "server",
    "AI_SCRATCHPAD",
]

default-members = [
    ".",
    "protocol/protocol",
    "basegame/base_types",
    "basegame/libraries",
    "bitmap",
    "bitplane_manager",
    "chunk_storage",
    "coordinates",
    "basegame/entity_rules",
    "pathfinding",
    "basegame/sca_rules",
    "simulation",
    "worldgen",
    "type_registry",
    "utilities",
    "server",
]
# Tessera is a project of its own, with its own workspace and tests.
exclude = ["diagnostics", "tessera"]

# Lines kept for the profilers -- perf, callgrind -- which say nothing
# useful without them; they cost no speed.
[profile.release]
debug = "line-tables-only"

# Bevy unoptimized is too slow to watch, even while the renderer itself is
# being worked on.
[profile.dev.package.bevy]
opt-level = 3
