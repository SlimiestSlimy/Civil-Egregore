[package]
name = "tilesim"
version = "0.1.0"
edition = "2021"
description = "TileSim, a 2D procedural simulation game: the program"
publish = false

[dependencies]
world = { path = "world" }
tessera = { path = "tessera" }
utilities = { path = "utilities" }

# Every crate of TileSim, built together: one lock file and one `target/`
# for them all, here, whichever crate's folder cargo is run from.
# `cargo test` here tests every one but the renderer, which brings Bevy:
# `cargo run --release -p renderer` for that. Tessera's external
# benchmarks stay a workspace of their own, so the codecs they compare
# against never enter this build.
[workspace]
resolver = "2"
members = [
    "allocator",
    "bitmap",
    "bitplane_manager",
    "chunk_storage",
    "coordinates",
    "entity_rules",
    "instructions",
    "pathfinding",
    "mc_rules",
    "simulation",
    "worldgen",
    "tessera",
    "utilities",
    "renderer",
    "world",
]
default-members = [
    ".",
    "allocator",
    "bitmap",
    "bitplane_manager",
    "chunk_storage",
    "coordinates",
    "entity_rules",
    "pathfinding",
    "mc_rules",
    "simulation",
    "worldgen",
    "tessera",
    "utilities",
    "world",
]
exclude = ["tessera/external_benchmarks"]

# Lines kept for the profilers -- perf, callgrind -- which say nothing
# useful without them; they cost no speed.
[profile.release]
debug = "line-tables-only"

# Bevy unoptimized is too slow to watch, even while the renderer itself is
# being worked on.
[profile.dev.package.bevy]
opt-level = 3
