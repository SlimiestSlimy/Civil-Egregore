[package]
name = "Civil_Egregore"
version = "0.6.0"
edition = "2024"
description = "Nudges to Civilization."
authors = ["SlimiestSlimy", "Opus 5.5 high"]
repository = "https://github.com/SlimiestSlimy/Civil-Egregore.git"

[dependencies]
client = { path = "client", optional = true }
protocol = { path = "protocol" }
server = { path = "server" }
utilities = { path = "utilities" }

# What the root's tests (`tests/fine`, `tests/fast`, `tests/complete`) reach into.
[dev-dependencies]
base_types = { path = "server/basegame/base_types" }
libraries = { path = "server/basegame/libraries" }
bitplane_manager = { path = "server/bitplane_manager" }
chunk_storage = { path = "server/chunk_storage" }
entity_manager = { path = "server/entity_manager" }
entity_rules = { path = "server/basegame/entity_rules" }
pathfinding = { path = "server/pathfinding" }
sca_rules = { path = "server/basegame/sca_rules" }
simulation = { path = "server/simulation" }
type_registry = { path = "protocol/type_registry" }
worldgen = { path = "server/basegame/worldgen" }

[features]
# `--features force_default_settings`: run on the built-in defaults
# (`utilities/force_default_settings.csv`), ignoring the machine's `settings.csv`.
force_default_settings = ["utilities/force_default_settings", "client?/force_default_settings"]
default = ["client"]

# Every crate of Civil Egregore, built together: one lock file and one `target/`
# for them all, here, whichever crate's folder cargo is run from.
# `cargo test` here tests every one but the client, which brings Bevy: `cargo run --release` opens the window. Tessera's external
# benchmarks stay a workspace of their own, so the codecs they compare
# against never enter this build.
[workspace]
members = [
    "protocol",
    "server/basegame/base_types",
    "server/basegame/libraries",
    "server/bitplane_manager",
    "server/chunk_storage",
    "server/entity_manager",
    "server/basegame/entity_rules",
    "server/pathfinding",
    "server/basegame/sca_rules",
    "server/simulation",
    "server/basegame/worldgen",
    "protocol/type_registry",
    "utilities",
    "client",
    "server",
    "AI_SCRATCHPAD",
]

default-members = [
    ".",
    "protocol",
    "server/basegame/base_types",
    "server/basegame/libraries",
    "server/bitplane_manager",
    "server/chunk_storage",
    "server/basegame/entity_rules",
    "server/pathfinding",
    "server/basegame/sca_rules",
    "server/simulation",
    "server/basegame/worldgen",
    "protocol/type_registry",
    "utilities",
    "server",
]
# Tessera is a project of its own, with its own workspace and tests.
exclude = ["tessera"]

# Lines kept for the profilers -- perf, callgrind -- which say nothing
# useful without them; they cost no speed.
[profile.release]
debug = "line-tables-only"

# Bevy unoptimized is too slow to watch, even while the renderer itself is
# being worked on.
[profile.dev.package.bevy]
opt-level = 3
