# Every crate of Civil Egregore's engine, built together: one lock file and one `target/`
# for them all, here, whichever crate's folder cargo is run from.
# Tessera and CDNF are projects of their own, with their own workspaces
# and tests; the base game a workspace of its own, built as a mod is.
[workspace]
members = [
    "utilities",
    "protocol",
    "server",
    "game_packager",
    "game_distribution",
    "mod_packager",
    "AI_SCRATCHPAD",
]
exclude = ["tessera", "cdnf", "basegame"]
resolver = "3"

# The game's one version.
[workspace.package]
version = "0.7.6"
edition = "2024"
authors = ["SlimiestSlimy", "Opus 5.5 high"]
repository = "https://github.com/SlimiestSlimy/Civil-Egregore.git"

# Every crate from outside the game, its version said once, here: kept to
# a bare minimum, each one in place of what would be the game's own to
# keep up for every OS.
[workspace.dependencies]
# The system's loader, on every OS (ISC).
libloading = "0.8"
# SHA-256, a library's hash: hard to forge (MIT or Apache-2.0).
sha2 = "0.10"

# Lines kept for the profilers -- perf, callgrind -- which say nothing
# useful without them; they cost no speed.
[profile.release]
debug = "line-tables-only"
