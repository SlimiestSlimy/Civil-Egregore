[package]
name = "gui"
edition = "2024"
description = "Civil Egregore's menus, over whatever window shows it: the main menu, the options Escape opens, and the sliders"

[dependencies]
utilities = { path = "../utilities" }
# Bevy for its interface and the keys only.
bevy = { version = "0.19", default-features = false, features = ["2d", "ui"] }

[features]
# The machine's settings file is neither read nor written: the settings are the default ones.
force_default_settings = ["utilities/force_default_settings"]
