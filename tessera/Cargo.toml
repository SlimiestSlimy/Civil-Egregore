[package]
name = "tessera"
version = "1.0.0"
edition = "2024"
description = "A lossless encoding of a 256x256 bitmap"

# A project of its own, apart from Civil Egregore's workspace: its tests
# run here alone, `cargo test` in this folder.
[workspace]

[dependencies]
bitmap = { path = "../utilities/bitmap" }
utilities = { path = "../utilities" }

# What the tiers' tests share (`tests/tests.rs`): no test program of its own.
[[test]]
name = "tests"
test = false

[profile.release]
debug = "line-tables-only"
