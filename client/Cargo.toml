[package]
name = "client"
edition = "2024"
autotests = false
description = "Civil Egregore's client: a Bevy window and its server, written afresh from the world's frozen types"

[dependencies]
utilities = { path = "../utilities" }
protocol = { path = "../protocol" }
# Bevy for the window, the drawing, the menus and the keys only: no 3D, no
# audio. Its Feathers widgets are what the gui types are built of.
bevy = { workspace = true }

[features]
# The machine's settings file is neither read nor written: the settings are the default ones.
force_default_settings = ["utilities/force_default_settings"]
