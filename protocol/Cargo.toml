[package]
name = "protocol"
edition = "2024"
description = "What the server, the client and the mods share: the world's types, the server's Rust types, the parameters, the messages and the wire"

# A shared library of its own, as the game ships it: the binaries, every
# other engine library and the mods link this one copy.
[lib]
crate-type = ["dylib"]

[dependencies]
utilities = { path = "../utilities" }
