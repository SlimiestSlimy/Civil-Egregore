[package]
name = "protocol"
edition = "2024"
description = "What the client and the server say to each other: the parameters a command line gives the server, the messages and the wire"

# A shared library of its own, as the game ships it: the binaries, every
# other engine library and the mods link this one copy.
[lib]
crate-type = ["dylib"]

[dependencies]
utilities = { path = "../utilities" }
