[package]
name = "protocol"
edition = "2024"
description = "What every part of the game shares: the kinds of types, the mods' manifests read and checked, and the type registry made of them"

# A shared library of its own, as the game ships it: the binaries, every
# other engine library and the mods link this one copy.
[lib]
crate-type = ["dylib"]

[dependencies]
utilities = { path = "../utilities" }
cdnf = { path = "../cdnf" }
