[package]
name = "utilities"
edition = "2024"
description = "General-purpose utilities: what diagnostics are made with (tables, reports, the process's memory), transient data, the numbers tuned by eye, a seeded random source, a fixed-capacity list, the cache"

# A shared library of its own, as the game ships it: the binaries, every
# other engine library and the mods link this one copy.
[lib]
crate-type = ["dylib"]

[dependencies]
libloading = { workspace = true }

# Its tests read their seed file, written in CDNF.
[dev-dependencies]
cdnf = { workspace = true }
