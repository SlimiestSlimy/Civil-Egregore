# What the simulation may not call: a float's logarithm, exponential,
# power or trigonometry is whatever the machine's maths library makes
# of it, and a world must follow from its seed alone, the same to the
# bit on every machine (`cargo run --release -- server check`). Whole
# numbers instead: `utilities::chance` for a chance and its gaps,
# `utilities::fixed_point` for a logarithm. A float's sum, product,
# quotient and square root are exact by the standard and are let be.
#
# This file is every crate's unless the crate has one of its own: the
# crates that are no part of what a world follows from -- the renderer,
# the menus, Tessera, the utilities, the AI's scratchpad -- each have an
# empty one. A new crate is held to this one until it says otherwise.

disallowed-methods = [
    { path = "f64::ln", reason = "not the same on every machine: whole numbers instead (utilities::chance, utilities::fixed_point)" },
