# The dynamic library experiment: does a game shipped as a folder -- two
# binaries, the engine's shared libraries, and mods as bundles of shared
# libraries (common, server, client) -- hold together in Rust?
# Its own workspace, apart from the game's. Build with `./run.sh`.
[workspace]
resolver = "3"
members = [
    "engine_common",
    "engine_server",
    "engine_client",
    "server_host",
    "client_host",
    "mods/shapes/common",
    "mods/shapes/server",
    "mods/shapes/client",
    "mods/painter/client",
]

[workspace.dependencies]
bevy = { version = "0.19", default-features = false, features = ["std", "multi_threaded", "async_executor", "2d", "ui", "bevy_feathers"] }

[profile.release]
debug = false
