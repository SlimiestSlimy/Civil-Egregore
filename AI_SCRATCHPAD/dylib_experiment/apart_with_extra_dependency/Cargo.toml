# A client mod built apart: Bevy from crates.io for its metadata and
# macros, the engine from the game's own libraries (--extern); linked to
# the Bevy inside the game's client engine.
[package]
name = "mod_with_extra_dependency"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["dylib"]

[workspace]

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["std", "multi_threaded", "async_executor", "2d", "ui", "bevy_feathers"] }
# A dependency of its own, shared with Bevy, asking one feature more.
bitflags = { version = "2", features = ["example_generated"] }

# The game's release profile, as the game's.
[profile.release]
debug = false
