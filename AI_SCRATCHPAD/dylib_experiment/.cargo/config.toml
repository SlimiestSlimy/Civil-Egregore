# Built with an explicit --target, so these reach the game's artifacts
# alone, not build scripts or proc macros. prefer-dynamic: one libstd
# shared by every library; $ORIGIN: each binary finds the engine's
# libraries beside itself, as in the game's folder.
[target.x86_64-unknown-linux-gnu]
# The build folders and Cargo's crate sources mapped to fixed names, so
# code a build script generates (serde's, thiserror's) hashes the same
# in any build folder: the game's, a mod's.
rustflags = ["-C", "prefer-dynamic", "-C", "link-args=-Wl,-rpath,$ORIGIN", "--remap-path-prefix=/home/Slimy/.cargo/registry/src=/cargo-registry", "--remap-path-prefix=/home/Slimy/container/programming/Rust/tilesim/AI_SCRATCHPAD/dylib_experiment/target=/build", "--remap-path-prefix=/home/Slimy/container/programming/Rust/tilesim/AI_SCRATCHPAD/dylib_experiment/apart_with_bevy/target=/build", "--remap-path-prefix=/home/Slimy/container/programming/Rust/tilesim/AI_SCRATCHPAD/dylib_experiment/apart_with_extra_dependency/target=/build"]

# Windows: the same, built with MinGW, run under Wine. A DLL is looked
# for beside the executable first, and one already loaded is reused by
# name -- no rpath.
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
rustflags = ["-C", "prefer-dynamic"]
