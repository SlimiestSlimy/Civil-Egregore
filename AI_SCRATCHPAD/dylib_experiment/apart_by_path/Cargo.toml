# A server bundle built apart, as a third party would: its own workspace,
# the engine's crates as path dependencies -- compiled again here.
[package]
name = "apart_by_path"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["dylib"]

[workspace]

[dependencies]
engine_server = { path = "../engine_server" }
shapes_common = { path = "../mods/shapes/common" }
