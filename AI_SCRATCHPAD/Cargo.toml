[package]
name = "AI_SCRATCHPAD"
edition = "2024"
description = "The AI's own scratchpad: probes of Civil Egregore, questions asked of a running host while working on it, and whatever else it tests with. Nothing may depend on this crate"

# NOTHING DEPENDS ON THIS CRATE: it is no part of the program, and may be
# deleted whole without anything else changing.
[dependencies]
coordinates = { path = "../utilities/coordinates" }
server = { path = "../server" }
utilities = { path = "../utilities" }
chunk_storage = { path = "../server/chunk_storage" }
simulation = { path = "../server/simulation" }
bitplane_manager = { path = "../server/bitplane_manager" }
entity_manager = { path = "../server/entity_manager" }
protocol = { path = "../protocol" }
