[package]
name = "server"
edition = "2024"
description = "Civil Egregore's server: the world as a whole, made from a seed, ticked -- its cells' rules and its entities together -- saved and loaded"

[dependencies]
type_registry = { path = "../type_registry" }
entity_manager = { path = "../entity_manager" }
bitmap = { path = "../bitmap" }
mc_rules = { path = "../mc_rules" }
worldgen = { path = "../worldgen" }
entity_rules = { path = "../entity_rules" }
simulation = { path = "../simulation" }
instructions = { path = "../instructions" }
coordinates = { path = "../coordinates" }
utilities = { path = "../utilities" }
bitplane_manager = { path = "../bitplane_manager" }
chunk_storage = { path = "../chunk_storage" }

# What the tiers' tests share (`tests/tests.rs`): no test program of its own.
[[test]]
name = "tests"
test = false
